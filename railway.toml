[build]
builder = "NIXPACKS"
buildCommand = "pip install -r Desktop_Application/Backend/requirements.txt"

[deploy]
startCommand = "cd Desktop_Application/Backend && python manage.py migrate && python manage.py create_default_admin && gunicorn myproject.wsgi:application --bind 0.0.0.0:$PORT"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[build.env]
NIXPACKS_PYTHON_VERSION = "3.11"
