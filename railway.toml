[build]
builder = "DOCKERFILE"
dockerfilePath = "Desktop_Application/Backend/Dockerfile"

[deploy]
startCommand = "python manage.py migrate && python manage.py create_default_admin && gunicorn myproject.wsgi:application --bind 0.0.0.0:$PORT"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
