<!DOCTYPE html>
<html lang="en">
  
<head>
  <meta charset="UTF-8">
  <title>Petmate Animal Clinic</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <!-- CSS LINKS -->
      <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css" />
      <link rel="stylesheet" href="../css/client.css"> 

      <!-- JAVASCRIPT LINKS -->
      <script src="https://cdn.jsdelivr.net/npm/flatpickr" defer></script>  <!--ETO BERT GAMITIN MO FLATPICKR-->
      <script src="../js/client.js" defer></script>
</head>

<body>
  <div class="frame">
    <!-- Left Side Navigation -->
    <div class="leftside">
        <div class="nav-header">
            <img src="../assets/hjk-removebg-preview.png" alt="user" class="nav-logo">
            <h1>Welcome</h1>
            <p class="welcome-text">USER HEHE</p>
        </div>
        
        <nav class="main-nav">
            <ul class="nav-menu">
                <li class="nav-item ">
                    <a href="#" id="addpets" class="nav-link">
                        <img src="../assets/icons/add.png" alt="Add Pets" class="nav-icon">
                        <span class="nav-text">Add Pets</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="#" id="viewpets" class="nav-link">
                        <img src="../assets/icons/view.png" alt="View Pets" class="nav-icon">
                        <span class="nav-text">View Pets</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="#" id="addclient" class="nav-link">
                        <img src="../assets/icons/appointment.png" alt="Set Appointment" class="nav-icon">
                        <span class="nav-text">Set Appointment</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="#" id="appointments" class="nav-link">
                        <img src="../assets/icons/view.png" alt="Appointments" class="nav-icon">
                        <span class="nav-text">View Appointments</span>
                    </a>
                </li>
            </ul>
            
            <div class="nav-divider"></div>
            
            <ul class="nav-menu secondary">
                <li class="nav-item">
                    <a href="#" id="settings" class="nav-link">
                        <img src="../assets/icons/settings.png" alt="Settings" class="nav-icon">
                        <span class="nav-text">Settings</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="#" id="logout" class="nav-link logout">
                        <img src="../assets/icons/logout.png" alt="Logout" class="nav-icon">
                        <span class="nav-text">Logout</span>
                    </a>
                </li>
            </ul>
        </nav>
    </div>

    <!-- Right Side Forms -->
    <div class="rightside">
      <div class="content-header">
          <img src="../assets/PETMATE LOGO.png" alt="Petmate Logo" class="logo">
      </div>
      
      
      <div class="form-container">
        <!-- ADD Pet Form -->
        <form class="pet-form">
              <div class="form-header">
                <h2>Pet Details</h2>
                <div class="icons">
                  <img src="../assets/icons/edit.png" alt="Edit Pet" id="editPet">
                  <img src="../assets/icons/delete.png" alt="Delete Pet" id="deletePet">
                </div>
              </div>

              <h3>Basic Information</h3>
              <div class="form-row">
                <input type="text" placeholder="Pet name" required>
                <input type="text" placeholder="Color" required>
              </div>

              <div class="form-row">
                <input type="text" placeholder="Breed" required>
                <select required>
                  <option value="" disabled selected>Species</option>
                  <option value="dog">Dog</option>
                  <option value="cat">Cat</option>
                  <option value="others">Others</option>
                </select>
              </div>

              <h3>Other Information</h3>
              <div class="form-row">
                <input type="text" placeholder="Birthday (MM/DD/YYYY)" required>
                <input type="text" placeholder="Age (Estimated)" required>

                <select required>
                  <option value="" disabled selected>Sex</option>
                  <option value="Male">Male</option>
                  <option value="Female">Female</option>
                </select>

                <input type="text" placeholder="Remarks (Optional)">
              </div>

              <div>
                <button type="submit" class="confirmbtn">CONFIRM</button>
              </div>
        </form> 
    
          <!-- VIEW PET FORM -->


        
          <!-- SET APPOINTMENT FORM -->
          <form class="client-form">  <!-- possible maging settings FORM or pwede tong maging karugtong sa appointment-form-->
              <div class="form-header">
                <h2>Customer Details</h2>
                <div class="icons">
                  <img src="../assets/icons/edit.png" alt="Edit" id="edit">
                  <img src="../assets/icons/delete.png" alt="Delete" id="delete">
                </div>
              </div>

              <h3>Basic Information</h3>
              <div class="form-row">
                <input type="text" placeholder="First name" required>
                <input type="text" placeholder="Last name" required>
                <input type="text" placeholder="Middle name (Optional)">
              </div>

              <div class="form-row">
                <input type="email" placeholder="Email" required>
                <input type="text" placeholder="Phone number" required>
                <input type="text" placeholder="Emergency no. (Optional)">
              </div>

              <h3>Address</h3>
              <div class="form-row">
                <input type="text" placeholder="Province" required>
                <input type="text" placeholder="City" required>
                <input type="text" placeholder="Barangay" required>
              </div>
              <div class="form-row">
                <input type="text" placeholder="Street address" required>
              </div>

              <div>
                <button type="submit" class="confirmbtn">CONFIRM</button>
              </div>
          </form>


          <!-- VIEW APPOINTMENTS FORM -->





          <!-- SETTINGS FORM -->



      </div>


      <form class="appointment-form">  <!-- SET APPOINTMENT FORM -->
          <div class="form-header">
            <h2>Set Appointment</h2>
          </div>

          <h3>Appointment Details</h3>
          <div class="form-row">
            <input type="text" placeholder="Preferred Date (MM/DD/YYYY)" required>
            <input type="text" placeholder="Preferred Time" required>
          </div>

          <div class="form-row">
            <select>
              <option value="" disabled selected >Service</option >
              <option value="consultation" required>Consultation</option>
              <option value="vaccination" required>Vaccination</option>
              <option value="grooming"required>Deworming</option>
              <option value="surgery"required>Surgery</option>
              <option value="others"required>Checkups</option>
            </select>
            <input type="text" placeholder="Dr. Gonzalez" disabled>
          </div>

          <div class="form-row">
            <input type="text" placeholder="Additional (Optional)">
          </div>

          <div>
            <button type="submit" class="confirmbtn">CONFIRM</button>
          </div>
        </form>
      </div>

    </div>



    
  </div>

</body>
</html>
