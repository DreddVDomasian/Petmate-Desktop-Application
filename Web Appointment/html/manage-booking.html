<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Booking</title>
    <link rel="stylesheet" href="../css/manage-booking.css">
</head>
<body>
    <header>
        <nav>
            <div>
                <a href="../html/index.html" class="logo">
                    <img src="../assets/PETMATE LOGO.png" alt="Petmate Logo">
                </a>
            </div>
        </nav>
    </header>

    <!-- Dog image as background -->
    <div class="dog-image">
        <img src="../assets/dog2.png" alt="Dog">
    </div>

    <main>
        <section class="booking-section">

            <form class="booking-form">
                <label for="booking-id">Booking ID:</label>
                <input type="text" id="booking-id" name="booking-id" placeholder="Enter your booking ID here..." required>
                
                <div class="button-container">
                    <button type="button" class="btn secondary" onclick="window.location.href='../html/index.html'">Back to Home</button>
                    <button type="submit" class="btn primary">Retrieve Booking</button>
                </div>
            </form>
        </section>
    </main>

    <footer class="footer">
        <div class="footer-content">
            <div class="footer-left">
                <img src="../assets/PETMATE LOGO.png" alt="PetMate Logo" class="footer-logo">
                <p class="footer-description">Providing exceptional veterinary care with compassion and expertise for your beloved pets.</p>
            </div>
            

            
            <div class="footer-right">
                <h3>Contact Info</h3>
                <div class="contact-item">
                    <img src="../assets/icons/Email.png" alt="Email">
                    <a href="mailto:petmate@gmail.com">petmate@gmail.com</a>
                </div>
                <div class="contact-item">
                    <img src="../assets/icons/FACEBOOK.png" alt="Facebook">
                    <a href="https://www.facebook.com/PetmateAnimalClinic" target="_blank">Petmate Animal Clinic</a>
                </div>
            </div>
        </div>
        
        <div class="footer-bottom">
            <p>©2024 PetMate Animal Clinic. All rights reserved.</p>
            <a href="#nav" class="back-to-top">
                <img src="../assets/icons/up-arrow.png" alt="Back to Top" class="arrowup">
            </a>
        </div>
    </footer>

</body>
</html>
