# Petmate-Desktop-Application/docker-compose.yml


services:
  backend:
    build: ./Desktop_Application/Backend
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
    volumes:
      - ./Desktop_Application/Backend:/app
    depends_on:
      db:
        condition: service_healthy  # ← WAIT for MySQL to be healthy
    healthcheck:  # ← ADD health check for backend
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: informationsystem
    ports:
      - "3306:3306"
    healthcheck:  # ← ADD health check for MySQL
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
      start_period: 40s

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: password
    depends_on:
      db:
        condition: service_healthy  # ← WAIT for MySQL to be healthy